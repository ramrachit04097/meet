<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <!-- Left Ring Gradient -->
    <linearGradient id="mf-left-ring-grad" x1="40" y1="50" x2="110" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0096ff" />
      <stop offset="50%" stop-color="#0077e6" />
      <stop offset="100%" stop-color="#0055cb" />
    </linearGradient>

    <!-- Right Ring Gradient -->
    <linearGradient id="mf-right-ring-grad" x1="100" y1="50" x2="175" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c8e2" />
      <stop offset="40%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#05c270" />
    </linearGradient>

    <!-- Sweeping Arrow Gradient -->
    <linearGradient id="mf-arrow-ribbon-grad" x1="38" y1="120" x2="175" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072eb" />
      <stop offset="25%" stop-color="#0099ff" />
      <stop offset="55%" stop-color="#00c9c8" />
      <stop offset="80%" stop-color="#05c270" />
      <stop offset="100%" stop-color="#00d084" />
    </linearGradient>

    <!-- Left Head Gradient -->
    <linearGradient id="mf-head-left-grad" x1="58" y1="20" x2="86" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00a2ff" />
      <stop offset="100%" stop-color="#0070e0" />
    </linearGradient>

    <!-- Right Head Gradient -->
    <linearGradient id="mf-head-right-grad" x1="122" y1="16" x2="150" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ec" />
      <stop offset="100%" stop-color="#00a8cc" />
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="mf-elevate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#004899" flood-opacity="0.22" />
    </filter>

    <filter id="mf-arrow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#002d6b" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Left Figure Head -->
  <circle cx="72" cy="38" r="14" fill="url(#mf-head-left-grad)" filter="url(#mf-elevate)" />

  <!-- Right Figure Head -->
  <circle cx="136" cy="32" r="14" fill="url(#mf-head-right-grad)" filter="url(#mf-elevate)" />

  <!-- Left Body Ring -->
  <circle cx="72" cy="92" r="30" stroke="url(#mf-left-ring-grad)" stroke-width="12" fill="none" filter="url(#mf-elevate)" />

  <!-- Right Body Ring -->
  <circle cx="136" cy="86" r="30" stroke="url(#mf-right-ring-grad)" stroke-width="12" fill="none" filter="url(#mf-elevate)" />

  <!-- Dynamic Sweeping Arrow -->
  <g filter="url(#mf-arrow-shadow)">
    <path 
      d="M 42 110 C 40 124, 62 134, 84 122 C 108 108, 136 78, 158 52" 
      stroke="url(#mf-arrow-ribbon-grad)" 
      stroke-width="11" 
      stroke-linecap="round" 
      fill="none" 
    />
    <!-- Arrowhead pointing up-right -->
    <polygon 
      points="176,34 150,42 168,64" 
      fill="#00d084" 
    />
  </g>
</svg>